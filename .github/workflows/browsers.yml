name: Full browser validation

# For release validation: every Playwright test in every browser. Start it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: All checks and browsers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7
