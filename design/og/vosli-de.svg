  <title>Vosli — Almancayı kelime kelime öğren</title>
  <!--
    Vosli Open Graph artwork, German. Source for public/og/vosli-de.png.
    The fox is public/icons/vosli-mark.svg and the roofline is HomeScene.tsx (FAR, NEAR, WINDOWS, LIT); path data is
    unchanged, only placed. As on Home, the fox sits behind the centre house: its ridge hides the chin and nose where the
    mask meets, and the stepped gable and the gable either side cover its lower corners. The Fernsehturm, FAR's last
    subpath, is moved left onto the canvas. Colours are Berlin Modern light tokens (src/styles/tokens.css), except the
    roofline, which is one step darker than the scene tokens so it still reads when the preview is scaled down.
    Text is live Fira Sans (SIL OFL), loaded from the installed @fontsource package so this file renders exactly when
    opened from the repository after npm ci.
    Export: open this file in Chromium at 1200 × 630, screenshot, then map to a 256-colour palette that keeps the brand
    colours exact (about 60 KB).
  -->
  <defs>
    <style>
      @font-face { font-family: 'Fira Sans'; font-weight: 400; src: url('../../node_modules/@fontsource/fira-sans/files/fira-sans-latin-ext-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Fira Sans'; font-weight: 600; src: url('../../node_modules/@fontsource/fira-sans/files/fira-sans-latin-ext-600-normal.woff2') format('woff2'); }
      text { font-family: 'Fira Sans', sans-serif; }
    </style>
    <!-- scene-glow token, softly fading as on Home. -->
    <radialGradient id="glow" cx="776" cy="426.7" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7473A" stop-opacity="0.26"/>
      <stop offset="0.4" stop-color="#B7473A" stop-opacity="0.117"/>
      <stop offset="1" stop-color="#B7473A" stop-opacity="0"/>
    </radialGradient>
    <!-- The roofline dissolves downwards, as on Home. -->
    <linearGradient id="fade-down" x1="0" y1="354.0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0.66" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="dissolve" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630"><rect width="1200" height="630" fill="url(#fade-down)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="#F7F5F1"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

