<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vosli" />
    <meta name="description" content="Learn German or English vocabulary with Vosli: add your own words, practice them and review them at the right time." />
    <title>Vosli — Learn and Practice Vocabulary</title>
    <!--
      Static metadata is in English, the default interface language: link previews, search and installs read it
      before any choice exists, and cannot see one made on a device. The app sets lang and the title from the saved
      choice (src/i18n/strings.ts). public/og/vosli-tr.png and vosli-de.png are the same artwork with the Turkish
      and German line, for pages and posts in those languages.
    -->
    <!-- Link previews and search read only this static HTML, so every URL here is absolute. -->
    <link rel="canonical" href="https://kaanddemir.github.io/vosli/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vosli" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://kaanddemir.github.io/vosli/" />
    <meta property="og:title" content="Vosli — Learn German, word by word" />
    <meta property="og:description" content="Learn German or English vocabulary with Vosli: add your own words, practice them and review them at the right time." />
    <meta property="og:image" content="https://kaanddemir.github.io/vosli/og/vosli-en.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Vosli fox winks from behind Berlin rooftops, next to “Vosli” and “Learn German, word by word”." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Applies the saved theme before first paint so the page never flashes the wrong colors. -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
